rules:
  - id: dangerous-python-eval
    languages: [python]
    message: "Avoid using eval() or exec() in Python. Use ast.literal_eval or safe parsers."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: dangerous-shell-subprocess
    languages: [python]
    message: "subprocess call with shell=True is risky. Pass arguments as a list with shell=False."
    severity: WARNING
    patterns:
      - pattern: subprocess.$METHOD(..., shell=True, ...)

  - id: insecure-pickle-load
    languages: [python]
    message: "pickle.load/loads on untrusted input can lead to arbitrary code execution."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)

  - id: bare-except-clause
    languages: [python]
    message: "Bare 'except:' caught. Specify concrete exception classes (e.g. Exception)."
    severity: INFO
    patterns:
      - pattern: |
          try:
            ...
          except:
            ...
